services:
  # ---------------------------------------------------------------------------
  # 1. DebugMind FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: debugmind-api
    env: python
    region: oregon
    plan: free
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: 1536
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: debugmind-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: debugmind-redis
          property: connectionString

  # ---------------------------------------------------------------------------
  # 2. DebugMind React + Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: debugmind-dashboard
    env: static
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://debugmind-api-9c95.onrender.com

  # ---------------------------------------------------------------------------
  # 3. DebugMind Redis Caching Service
  # ---------------------------------------------------------------------------
  - type: redis
    name: debugmind-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

# -----------------------------------------------------------------------------
# Databases
# -----------------------------------------------------------------------------
databases:
  - name: debugmind-postgres
    region: oregon
    plan: free
    databaseName: debugmind
    user: debugmind_user
