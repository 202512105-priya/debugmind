services:
  # ---------------------------------------------------------------------------
  # 1. DebugMind FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: debugmind-api
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: 1536
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: debugmind-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: debugmind-redis
          property: connectionString

  # ---------------------------------------------------------------------------
  # 2. DebugMind React + Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: debugmind-dashboard
    env: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: debugmind-api
          property: url

# -----------------------------------------------------------------------------
# Databases & Redis Caching Services
# -----------------------------------------------------------------------------
databases:
  - name: debugmind-postgres
    region: oregon
    plan: starter
    databaseName: debugmind
    user: debugmind_user

redis:
  - name: debugmind-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
