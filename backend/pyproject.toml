[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debugmind-backend"
version = "0.1.0"
description = "FastAPI backend for DebugMind"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.3",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
